[project]
name = "week02-orb-reconfirm"
version = "0.1.0"
description = "2주차 장 초반 가격 돌파 재확인 전략 (삼성전자 주식선물, NH선물 모의)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
